</style></head><body><div class="shell"><aside class="sidebar"><button class="hamburger" id="menuToggle" aria-label="Abrir menu de navegação" aria-expanded="false" onclick="toggleMobileMenu()"><span></span><span></span><span></span></button><div class="logo"><div class="symbol">✳</div><div class="brand">Bem no Turno<small>MVP DEMONSTRATIVO</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot"><strong>Ambiente de demonstração</strong><br>Os dados históricos do RH são fictícios. Suas interações são salvas apenas neste navegador.<button onclick="resetDemo()">↻ Reiniciar demonstração</button></div></aside><main class="main"><header class="topbar"><div class="eyebrow" id="sectionLabel">SAÚDE E BEM-ESTAR</div><div class="topright"><span class="pill">● Turno da tarde • 14h–22h</span><span class="avatar">AN</span></div></header><div id="view"></div></main></div><div class="mobile-drawer-backdrop" id="mobileDrawer" onclick="if(event.target===this)closeMobileMenu()"><aside class="mobile-drawer" aria-label="Menu de navegação"><div class="drawer-top"><strong>Seções</strong><button class="drawer-close" aria-label="Fechar menu" onclick="closeMobileMenu()">×</button></div><nav class="nav" id="mobileNav" aria-label="Navegação móvel"></nav><div class="drawer-note">Bem-estar no seu ritmo<br><small>Ambiente de demonstração</small></div></aside></div><div id="modalroot"></div><div id="toastroot"></div><script>

const KEY='bem-no-turno-mvp-v3';const seed={enrolled:[],present:[],absent:{},ratings:{},votes:null,points:0,transactions:[]};let state=load(),section='inicio',modal=null,valeusTab='saldo';function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&Array.isArray(s.enrolled)?{...structuredClone(seed),...s,transactions:Array.isArray(s.transactions)?s.transactions:[]}:structuredClone(seed)}catch{return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function eventBy(id){return EVENTS.find(e=>e.id===id)}function toast(t){const root=document.getElementById('toastroot');root.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>{root.innerHTML=''},3300)}function navTo(t){section=t;if(t==='valeus')valeusTab='saldo';modal=null;closeMobileMenu();render();window.scrollTo(0,0)}function toggleMobileMenu(){let d=document.getElementById('mobileDrawer'),b=document.getElementById('menuToggle'),open=!d.classList.contains('open');d.classList.toggle('open',open);b.setAttribute('aria-expanded',String(open))}function closeMobileMenu(){let d=document.getElementById('mobileDrawer'),b=document.getElementById('menuToggle');if(d&&b){d.classList.remove('open');b.setAttribute('aria-expanded','false')}}function renderNav(){let items=[['inicio','⌂','Início'],['minhas','▣','Minhas ações'],['valeus','◉','Valeus'],['rh','▥','Painel do RH']];let navHtml=items.map(([k,i,t])=>`<button class="${section===k?'on':''}" onclick="navTo('${k}')"><span class="ico">${i}</span>${t}</button>`).join('');document.getElementById('nav').innerHTML=navHtml;document.getElementById('mobileNav').innerHTML=navHtml}

function home(){return `<h1 class="h1">Olá, Ana! 👋</h1><p class="sub">Encontre atividades de saúde e bem-estar que cabem na sua rotina.</p><div class="sectionhead"></div><div class="hero"><div><div class="eyebrow" style="color:#c7e9d2">SEU BEM-ESTAR IMPORTA</div><h2>Um pequeno cuidado<br>faz parte do seu dia.</h2><p>Veja as próximas ações, participe e ajude a melhorar a programação para todos.</p><button class="btn light" onclick="document.getElementById('eventos').scrollIntoView({behavior:'smooth'})">Ver atividades disponíveis →</button></div><div class="heroart">🌿</div></div><div id="eventos" class="sectionhead"><h2>Próximas ações para você</h2><small>Exemplos para demonstração</small></div><div class="cards">${EVENTS.map(eventCard).join('')}</div><div class="sectionhead"><h2>Por que participar?</h2></div><div class="three"><div class="panel"><h3>📣 Tudo em um lugar</h3><p class="sub">Você sabe o que vai acontecer, quando e onde.</p></div><div class="panel"><h3>🕒 Respeito ao turno</h3><p class="sub">Atividades com horário e duração visíveis para organizar sua participação.</p></div><div class="panel"><h3>💬 Sua opinião importa</h3><p class="sub">Mesmo se não participar, você pode contar o motivo e ajudar o RH.</p></div></div>`}
function eventCard(e){let status=state.present.includes(e.id)?'Presença registrada':state.absent[e.id]?'Ausência informada':state.enrolled.includes(e.id)?'Inscrito':'Ver atividade';return `<article class="event"><div class="eventpic"><span class="tag">${e.cat}</span>${e.icon}</div><div class="eventbody"><h3>${e.name}</h3><p>${e.desc}</p><div class="meta"><span>📆 <b>${e.when}</b> · ${e.time}</span><span>⏱ ${e.duration} &nbsp; 📍 ${e.place}</span></div><button class="btn ${state.enrolled.includes(e.id)?'secondary':''}" onclick="openEvent('${e.id}')">${status} →</button></div></article>`}
function myActivities(){let active=EVENTS.filter(e=>state.enrolled.includes(e.id)&&!state.present.includes(e.id)&&!state.absent[e.id]),history=EVENTS.filter(e=>state.enrolled.includes(e.id)&&(state.present.includes(e.id)||state.absent[e.id]));let pending=active.length?active.map(e=>`<div class="activity-row"><div><h3>${e.icon} ${e.name}</h3><p>${e.when} · ${e.time} · ${e.place}</p><div style="margin-top:8px"><span class="badge blue">Inscrito</span></div></div><div class="activity-actions"><button class="btn outline" onclick="openModal('checkin','${e.id}')">✓ Check-in</button><button class="btn danger" onclick="openModal('ausencia','${e.id}')">Não participei</button></div></div>`).join(''):'<div class="empty"><div>📅</div><h3>Nenhuma ação pendente</h3><p>Quando você se inscrever, poderá acompanhar sua participação aqui.</p><button class="btn" onclick="navTo(\'inicio\')">Ver atividades</button></div>';let records=history.length?history.map(e=>{let absent=state.absent[e.id],present=state.present.includes(e.id);return `<div class="activity-row"><div><h3>${e.icon} ${e.name}</h3><p>${e.when} · ${e.time} · ${e.place}</p><div style="margin-top:8px">${present?'<span class="badge">✓ Participou</span>':'<span class="badge yellow">Ausência informada</span>'}${absent?`<p class="note" style="margin-top:9px">Motivo: ${esc(absent.reason)}${absent.timing?' · Período preferido: '+esc(absent.timing):''}</p>`:''}</div></div><div class="activity-actions">${present?`<button class="btn secondary" onclick="openModal('feedback','${e.id}')">☏ Feedback</button>`:''}</div></div>`}).join(''):'<p class="note">As ações concluídas ou com ausência informada aparecerão aqui.</p>';return `<h1 class="h1">Minhas ações</h1><p class="sub">Acompanhe suas inscrições, confirme presença ou informe quando não puder participar.</p><div class="info">🧪 <b>Modo de demonstração:</b> você pode simular o check-in ou registrar uma ausência imediatamente, sem esperar a data da atividade.</div><div class="sectionhead"><h2>Ações pendentes (${active.length})</h2></div>${pending}<div class="sectionhead"><h2>Histórico das ações</h2><small>Participações e ausências informadas</small></div>${records}`}
function setValeusTab(tab){valeusTab=tab;render()}
function rewardBy(id){return REWARDS.find(r=>r.id===id)}
function rewardCard(r){let owned=state.points>=r.price;return `<article class="panel reward-card"><div class="reward-icon">${r.icon}</div><div class="badge">${r.price} Valeus</div><h3>${esc(r.name)}</h3><p class="note">${esc(r.desc)}</p><button class="btn ${owned?'':'secondary'}" ${owned?'':'disabled'} onclick="openModal('redeem','${r.id}')">${owned?'Resgatar':'Faltam '+(r.price-state.points)+' Valeus'}</button></article>`}
function valeus(){if(valeusTab==='desafio')return `<h1 class="h1">Desafio do mercado</h1><p class="sub">Uma meta coletiva de bem-estar para a equipe, sem ranking individual.</p><div class="subtabs"><button class="subtab" onclick="setValeusTab('saldo')">Meu saldo</button><button class="subtab active" onclick="setValeusTab('desafio')">Desafio do mercado</button></div>${collectiveChallenge()}`;let earned=state.transactions.filter(t=>t.type==='credit').reduce((s,t)=>s+t.amount,0),spent=state.transactions.filter(t=>t.type==='redeem').reduce((s,t)=>s+t.amount,0),next=REWARDS.find(r=>r.price>state.points),gap=next?next.price-state.points:0;let history=state.transactions.slice().reverse().slice(0,5).map(t=>{let item=t.type==='credit'?eventBy(t.eventId)?.name||'Participação em atividade':rewardBy(t.rewardId)?.name||'Recompensa resgatada';return `<div class="leader"><span>${t.type==='credit'?'✓':'🎁'} ${esc(item)}</span><strong>${t.type==='credit'?'+':'−'}${t.amount} Valeus</strong></div>`}).join('');return `<h1 class="h1">Meu Valeus</h1><p class="sub">Seu saldo e suas recompensas, em um só lugar. Participe de uma atividade e troque seus Valeus por um produto escolhido pelo mercado.</p><div class="subtabs"><button class="subtab active" onclick="setValeusTab('saldo')">Meu saldo</button><button class="subtab" onclick="setValeusTab('desafio')">Desafio do mercado</button></div><div class="info warn">🎁 <b>Catálogo demonstrativo:</b> produtos e valores são exemplos. A unidade escolhe itens já disponíveis no supermercado e define a quantidade e o custo em Valeus.</div><div class="stats"><div class="stat"><span class="ico">🪙</span><b>${state.points}</b><span>Saldo disponível</span></div><div class="stat"><span class="ico">✓</span><b>${state.present.length}</b><span>Atividades concluídas</span></div><div class="stat"><span class="ico">＋</span><b>${earned}</b><span>Valeus recebidos</span></div><div class="stat"><span class="ico">🎁</span><b>${spent}</b><span>Valeus usados</span></div></div><div class="two"><div class="panel"><h3>Próxima recompensa</h3><p class="note">${next?`Faltam ${gap} Valeus para resgatar ${esc(next.name)}.`:'Você já pode escolher qualquer item do catálogo.'}</p>${next?`<div class="next-reward"><span>${next.icon}</span><div><b>${esc(next.name)}</b><small>${next.price} Valeus</small></div><div class="bar"><div style="width:${Math.min(Math.round(state.points/next.price*100),100)}%"></div></div></div>`:''}</div><div class="panel"><h3>Como acumular</h3><p class="sub">Confirme presença em uma ação para receber <b>10 Valeus</b> nesta demonstração. O valor pode ser ajustado após conversar com trabalhadores e gestores.</p><button class="btn secondary" onclick="navTo('inicio')">Ver atividades →</button></div></div><div class="sectionhead"><h2>Recompensas da unidade</h2><small>Exemplos de produtos do supermercado</small></div><div class="three reward-grid">${REWARDS.map(rewardCard).join('')}</div><div class="sectionhead"><h2>Movimentações recentes</h2><small>Salvas somente neste navegador</small></div><div class="panel">${history||'<p class="note">Suas participações e resgates aparecerão aqui.</p>'}</div>`}
function collectiveChallenge(){let myPoints=state.present.length*10+Object.keys(state.ratings).length*5;let value=(226+myPoints);return `<div class="hero" style="margin-top:24px"><div><div class="eyebrow" style="color:#d5e9d7">META COLETIVA · DEMONSTRAÇÃO</div><h2>Juntos por uma<br>rotina mais saudável</h2><p>Quando a equipe alcançar 300 pontos, desbloqueia um café coletivo de confraternização.</p><span style="font-weight:700">${value} / 300 pontos</span><div class="bar" style="margin-top:10px;background:#ffffff41"><div style="width:${Math.min(value/300*100,100)}%;background:#a9e6ba"></div></div></div><div class="heroart">🏆</div></div><div class="two" style="margin-top:20px"><div class="panel"><h3>Como pontuar</h3><p class="sub">Participação confirmada: <b>10 pontos</b><br>Feedback após atividade: <b>5 pontos</b></p><div class="line"></div><div class="bigquote">Você contribuiu com ${myPoints} pontos</div><p class="note">A pontuação inicial da equipe é fictícia. O desafio não mostra ranking individual nem substitui o incentivo pessoal em Valeus.</p></div><div class="panel"><h3>Escolha a próxima atividade</h3><p class="sub">Qual tema você gostaria de ver na próxima programação?</p><div class="field"><select id="vote"><option value="">Selecione um tema...</option><option value="Sono e descanso" ${state.votes==='Sono e descanso'?'selected':''}>Sono e descanso</option><option value="Ergonomia" ${state.votes==='Ergonomia'?'selected':''}>Ergonomia</option><option value="Saúde mental" ${state.votes==='Saúde mental'?'selected':''}>Saúde mental</option><option value="Nutrição" ${state.votes==='Nutrição'?'selected':''}>Nutrição</option></select></div><button class="btn" onclick="vote()">Registrar minha preferência</button>${state.votes?`<p class="info">Sua preferência: ${esc(state.votes)}</p>`:''}</div></div>`}
function hr(){let n=state.enrolled.length,p=state.present.length,a=Object.keys(state.absent).length,f=Object.keys(state.ratings).length,baseline={invites:420,enroll:312,present:241,feedback:96};let totalEnroll=baseline.enroll+n,totalPresent=baseline.present+p,rate=Math.round(totalPresent/(baseline.invites)*100);let reasons=[['Horário incompatível',34],['Não consegui sair do setor',22],['Não soube da ação',18],['Esqueci',16],['Outros',10]];let actual=Object.values(state.absent).map(x=>x.reason);return `<h1 class="h1">Painel de engajamento</h1><p class="sub">Visão demonstrativa do RH para identificar oportunidades de melhoria nas ações.</p><div class="info warn">⚠️ <b>Dados fictícios:</b> os indicadores de base foram inventados somente para ilustrar o painel. As inscrições, presenças e respostas que você registrar neste navegador são adicionadas à simulação. Não são resultados da pesquisa de campo.</div><div class="stats"><div class="stat"><span class="ico">📨</span><b>${baseline.invites}</b><span>Convites simulados</span></div><div class="stat"><span class="ico">📝</span><b>${totalEnroll}</b><span>Inscrições</span></div><div class="stat"><span class="ico">✅</span><b>${totalPresent}</b><span>Presenças registradas</span></div><div class="stat"><span class="ico">📊</span><b>${rate}%</b><span>Presenças ÷ convites</span></div></div><div class="two"><div class="panel"><h3>Presença por turno</h3><p class="note">Valores ilustrativos para orientar decisões do RH.</p>${[['Manhã',72],['Tarde',58],['Noite',38]].map(([t,v])=>`<div class="chartrow"><div class="chartlabels"><b>${t}</b><span>${v}%</span></div><div class="bar"><div style="width:${v}%"></div></div></div>`).join('')}<div class="info">💡 <b>Hipótese a verificar:</b> oferecer mais horários ou organizar revezamento no turno com menor adesão.</div></div><div class="panel"><h3>Motivos de ausência</h3><p class="note">Distribuição de exemplo; respostas novas são listadas separadamente.</p>${reasons.map(([t,v])=>`<div class="chartrow"><div class="chartlabels"><b>${t}</b><span>${v}%</span></div><div class="bar orange"><div style="width:${v}%"></div></div></div>`).join('')}</div></div><div class="sectionhead"><h2>Registros feitos nesta demonstração</h2><small>Dados locais, sem envio para servidor</small></div><div class="panel"><table class="tbl"><thead><tr><th>Indicador</th><th>Registrado agora</th></tr></thead><tbody><tr><td>Novas inscrições</td><td>${n}</td></tr><tr><td>Check-ins realizados</td><td>${p}</td></tr><tr><td>Motivos de ausência</td><td>${a}</td></tr><tr><td>Avaliações recebidas</td><td>${f}</td></tr></tbody></table>${actual.length?`<div class="line"></div><h3>Motivos informados durante o teste</h3>${actual.map(x=>`<div class="chartrow">• ${esc(x)}</div>`).join('')}`:''}${state.votes?`<div class="info">Tema sugerido na votação: <b>${esc(state.votes)}</b></div>`:''}</div><div class="sectionhead"><h2>Como o RH pode agir?</h2></div><div class="three"><div class="panel"><h3>🕒 Ajustar horários</h3><p class="sub">Analisar turnos menos atendidos e testar novos horários ou revezamentos.</p></div><div class="panel"><h3>📣 Melhorar comunicação</h3><p class="sub">Divulgar atividades em canais realmente acessados pelos colaboradores.</p></div><div class="panel"><h3>🧩 Entender a ausência</h3><p class="sub">Investigar motivos relatados antes de atribuir a baixa adesão à falta de interesse.</p></div></div>`}
function openEvent(id){modal={type:'event',id};renderModal()}function openModal(type,id){modal={type,id};renderModal()}function closeModal(){modal=null;renderModal()}function renderModal(){let root=document.getElementById('modalroot');if(!modal){root.innerHTML='';return}let e=eventBy(modal.id);let content='';if(modal.type==='event')content=`<div class="modalhead"><div><div class="eyebrow">${e.cat}</div><h2>${e.icon} ${e.name}</h2></div><button class="x" onclick="closeModal()">✕</button></div><p class="sub">${e.desc}</p><div class="line"></div><div class="meta" style="font-size:14px"><span>📆 <b>${e.when}</b> · ${e.time}</span><span>📍 ${e.place}</span><span>⏱ Duração: ${e.duration}</span><span>👥 Organização: atividade prevista para ${e.shift.toLowerCase()}</span></div><div class="info">O RH deve organizar a liberação e o revezamento conforme as necessidades do setor. A inscrição não garante automaticamente a liberação.</div>${state.enrolled.includes(e.id)?`<button class="btn" onclick="navTo('minhas')">Acompanhar minha inscrição →</button>`:`<button class="btn" onclick="enroll('${e.id}')">Confirmar interesse / inscrição</button>`}`;
if(modal.type==='checkin')content=`<div class="modalhead"><h2>Confirmar presença</h2><button class="x" onclick="closeModal()">✕</button></div><p class="sub">${e.name}</p><div class="checkicon">▦</div><div class="info">Simulação de leitura do QR Code. No teste, clique abaixo para registrar sua presença nesta atividade.</div><button class="btn" onclick="checkin('${e.id}')">✓ Simular leitura e confirmar presença</button>`;
if(modal.type==='ausencia')content=`<div class="modalhead"><h2>Por que não participou?</h2><button class="x" onclick="closeModal()">✕</button></div><p class="sub">Sua resposta ajudará a planejar melhor as próximas ações.</p><div class="field"><label for="reason">Principal motivo</label><select id="reason"><option value="">Selecione...</option><option>Não fiquei sabendo a tempo</option><option>Horário incompatível</option><option>Não consegui sair do meu setor</option><option>Esqueci da atividade</option><option>O tema não me interessou</option><option>Outro motivo</option></select></div><div class="field"><label for="timing">Qual período seria melhor? (opcional)</label><select id="timing"><option value="">Prefiro não informar</option><option>Manhã</option><option>Tarde</option><option>Noite</option></select></div><p class="note">O motivo é mostrado no painel em formato agregado. O MVP não solicita dados sensíveis de saúde.</p><button class="btn" onclick="absence('${e.id}')">Enviar resposta</button>`;
if(modal.type==='redeem'){let r=rewardBy(modal.id);content=`<div class="modalhead"><h2>Resgatar recompensa</h2><button class="x" onclick="closeModal()">✕</button></div><div class="checkicon">${r.icon}</div><p class="sub">${esc(r.name)} · ${r.price} Valeus</p><div class="info">Este resgate é apenas uma simulação. Em uma versão real, a unidade define a disponibilidade do item e como entregar a recompensa.</div><button class="btn" onclick="redeemReward('${r.id}')" ${state.points<r.price?'disabled':''}>Confirmar resgate</button>`}
if(modal.type==='feedback')content=`<div class="modalhead"><h2>Avaliar atividade</h2><button class="x" onclick="closeModal()">✕</button></div><p class="sub">${e.name}</p><div class="field"><label for="rating">Como você avalia a atividade?</label><select id="rating"><option value="">Selecione...</option><option value="5">5 — Excelente</option><option value="4">4 — Boa</option><option value="3">3 — Regular</option><option value="2">2 — Ruim</option><option value="1">1 — Muito ruim</option></select></div><div class="field"><label for="comment">Comentário (opcional)</label><textarea id="comment" placeholder="O que podemos melhorar?"></textarea></div><button class="btn" onclick="feedback('${e.id}')">Enviar avaliação</button>`;
root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function enroll(id){if(!state.enrolled.includes(id))state.enrolled.push(id);save();closeModal();toast('Inscrição confirmada! Veja em Minhas ações.');render()}
function checkin(id){if(!state.enrolled.includes(id)){toast('Inscreva-se antes de confirmar presença.');return}if(!state.present.includes(id)){state.present.push(id);state.points+=10;state.transactions.push({type:'credit',eventId:id,amount:10,at:new Date().toISOString()})}delete state.absent[id];save();closeModal();render();toast('Presença registrada! +10 pontos coletivos e +10 Valeus.')}
function absence(id){let val=document.getElementById('reason').value,t=document.getElementById('timing').value;if(!val){toast('Selecione o motivo da ausência.');return}state.absent[id]={reason:val,timing:t};state.present=state.present.filter(x=>x!==id);save();closeModal();render();toast('Ausência informada. A inscrição foi movida para o histórico.')}
function feedback(id){let val=document.getElementById('rating').value;let comment=document.getElementById('comment').value;if(!val){toast('Selecione uma avaliação.');return}state.ratings[id]={score:Number(val),comment};save();closeModal();render();toast('Avaliação registrada! Obrigado pelo seu feedback.')}
function redeemReward(id){let r=rewardBy(id);if(!r||state.points<r.price){toast('Você ainda não tem Valeus suficientes para este item.');return}state.points-=r.price;state.transactions.push({type:'redeem',rewardId:id,amount:r.price,at:new Date().toISOString()});save();closeModal();render();toast('Resgate demonstrativo registrado. Consulte a unidade para definir a entrega.')}
function vote(){let val=document.getElementById('vote').value;if(!val){toast('Escolha um tema antes de votar.');return}state.votes=val;save();render();toast('Sua preferência foi registrada!')}
function resetDemo(){if(!confirm('Reiniciar as inscrições, presenças, ausências e votos desta demonstração?'))return;state=structuredClone(seed);save();navTo('inicio');toast('Demonstração reiniciada.')}render();
</script></body></html>
