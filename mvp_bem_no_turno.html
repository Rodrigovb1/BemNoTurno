<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bem no Turno | MVP Interativo</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
:root{--bg:#f5f7f4;--ink:#19382c;--muted:#63786c;--green:#175b42;--green2:#23835e;--mint:#e2f2e7;--line:#e1e8e1;--orange:#e9a456;--card:#fff;--shadow:0 12px 38px rgba(14,52,34,.055)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #f4b970;outline-offset:2px}.shell{max-width:1240px;margin:auto;display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{padding:32px 16px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:25px}.logo{display:flex;gap:11px;align-items:center;padding:8px 14px}.symbol{height:41px;width:41px;background:var(--green);color:#fff;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:700}.brand{font-family:'Plus Jakarta Sans';font-weight:800;font-size:18px;line-height:1.03}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.1em;margin-top:5px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{display:flex;gap:12px;align-items:center;border:0;background:transparent;color:#5d7166;padding:14px;border-radius:13px;text-align:left;font-weight:700}.nav button.on{background:var(--mint);color:var(--green)}.nav button:hover{background:#f1f6f1}.nav button span.ico{font-size:19px;width:25px;text-align:center}.sidefoot{margin-top:auto;border-radius:16px;padding:16px;background:#eef5ef;font-size:12px;color:var(--muted)}.sidefoot strong{color:var(--ink)}.sidefoot button{margin-top:12px;width:100%;border:1px solid #d0e0d5;background:white;color:var(--green);border-radius:9px;padding:9px;font-weight:700}.main{padding:30px 42px 70px;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px;gap:14px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--green2);font-weight:800}.topright{display:flex;align-items:center;gap:10px}.pill{background:#e4f2e9;color:var(--green);font-weight:700;font-size:12px;border-radius:100px;padding:9px 13px}.avatar{display:grid;place-items:center;width:39px;height:39px;border-radius:50%;background:#d6e4d9;color:var(--green);font-weight:800}.h1{font-family:'Plus Jakarta Sans';font-size:clamp(26px,3vw,38px);letter-spacing:-.05em;line-height:1.2;margin:0 0 10px}.sub{margin:0;color:var(--muted);line-height:1.6}.hero{background:var(--green);color:#fff;padding:29px 32px;border-radius:22px;display:grid;grid-template-columns:1fr 220px;gap:20px;overflow:hidden;position:relative}.hero:after{content:'';position:absolute;border:37px solid #ffffff15;width:250px;height:250px;right:-98px;top:-124px;border-radius:50%}.hero h2{font-family:'Plus Jakarta Sans';letter-spacing:-.04em;font-size:29px;line-height:1.24;margin:9px 0}.hero p{color:#dbecdf;line-height:1.55;margin:0 0 23px}.heroart{font-size:109px;display:grid;place-items:center;filter:drop-shadow(0 10px 12px #092c2436)}.btn{border:0;border-radius:11px;padding:12px 18px;background:var(--green);color:#fff;font-weight:700;display:inline-flex;gap:9px;align-items:center;justify-content:center}.btn:hover{background:#237452}.btn.light{background:#fff;color:var(--green)}.btn.outline{background:#fff;border:1px solid #bcd7c4;color:var(--green)}.btn.secondary{background:#e6f1e9;color:var(--green)}.btn.danger{background:#fff0eb;color:#a34d31}.btn:disabled{opacity:.5;cursor:not-allowed}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 17px}.sectionhead h2{font-size:19px;letter-spacing:-.025em;margin:0;font-family:'Plus Jakarta Sans'}.sectionhead small{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.event{background:var(--card);border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}.eventpic{height:146px;display:grid;place-items:center;position:relative;background:#e7f1ed;font-size:66px}.event:nth-child(2) .eventpic{background:#f6eee2}.event:nth-child(3) .eventpic{background:#e7edf6}.tag{font-size:11px;font-weight:800;border-radius:20px;padding:6px 10px;background:#ffffffed;color:var(--green)}.eventpic .tag{position:absolute;top:13px;left:13px}.eventbody{padding:19px;display:flex;flex:1;flex-direction:column}.event h3{font-family:'Plus Jakarta Sans';font-size:16px;margin:0 0 9px;letter-spacing:-.03em}.event p{font-size:13px;line-height:1.5;margin:0 0 15px;color:var(--muted)}.meta{display:flex;flex-direction:column;gap:9px;font-size:12px;color:#52695d;margin-top:auto;margin-bottom:16px}.meta b{color:var(--ink)}.event .btn{width:100%;font-size:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:23px;box-shadow:var(--shadow)}.panel h3{font-family:'Plus Jakarta Sans';margin:0 0 10px;font-size:17px}.line{height:1px;background:var(--line);margin:20px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat{background:#fff;padding:20px;border-radius:16px;border:1px solid var(--line)}.stat b{display:block;font:800 30px 'Plus Jakarta Sans';letter-spacing:-.05em;margin:10px 0 5px}.stat span{color:var(--muted);font-size:12px}.stat .ico{font-size:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:17px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.empty{padding:50px 15px;text-align:center;border-radius:16px;border:1px dashed #cbdcd0;background:#fff;color:var(--muted)}.empty div{font-size:42px}.activity-row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}.activity-row h3{margin:0 0 6px;font-size:16px}.activity-row p{margin:0;color:var(--muted);font-size:12px}.activity-actions{display:flex;gap:8px;flex-wrap:wrap}.activity-actions .btn{padding:10px 12px;font-size:12px}.info{background:#edf5ef;border:1px solid #d5e6d7;color:#426951;border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.6;margin:16px 0}.warn{background:#fff8ed;border-color:#fae6c8;color:#78582a}.chartrow{margin:18px 0}.chartlabels{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}.bar{height:12px;background:#edf1ed;border-radius:30px;overflow:hidden}.bar div{height:100%;background:#2d9067;border-radius:30px}.bar.orange div{background:#dea35d}.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:13px 9px;border-bottom:1px solid var(--line)}.tbl td{padding:14px 9px;border-bottom:1px solid var(--line)}.badge{border-radius:50px;background:#e9f4eb;color:var(--green);padding:5px 9px;font-size:11px;font-weight:700}.badge.yellow{background:#fff0d7;color:#95621c}.badge.blue{background:#e8edfa;color:#4c6391}.muted{color:var(--muted)}.bigquote{font:800 25px/1.3 'Plus Jakarta Sans';letter-spacing:-.04em}.leaderboard{display:grid;gap:13px}.leader{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.leader strong{color:var(--green)}.overlay{position:fixed;inset:0;background:#142a20a8;z-index:10;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(510px,100%);max-height:94vh;overflow:auto;background:white;border-radius:23px;padding:28px;box-shadow:0 22px 80px #0d231f45}.modalhead{display:flex;align-items:start;justify-content:space-between;gap:20px}.modalhead h2{font:800 24px 'Plus Jakarta Sans';letter-spacing:-.04em;margin:0 0 10px}.x{border:0;background:#f1f4f1;border-radius:9px;padding:8px 12px}.field{margin:16px 0}.field label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}.field input,.field textarea,.field select{display:block;width:100%;background:#fff;border:1px solid #cfddd2;border-radius:11px;padding:13px;color:var(--ink)}.field textarea{resize:vertical;min-height:85px}.modal .btn{width:100%;margin-top:12px}.checkicon{font-size:54px;text-align:center;padding:15px}.note{font-size:12px;color:var(--muted);line-height:1.5}.hide{display:none!important}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.step{padding:10px 12px;border-radius:11px;background:#e7f0ea;color:var(--green);font-size:12px;font-weight:700}.toast{position:fixed;bottom:18px;right:20px;z-index:20;background:#183d2d;color:white;border-radius:13px;padding:15px 18px;box-shadow:0 16px 45px #152b2360;font-size:13px;max-width:380px}.smallbtn{font-size:12px;padding:9px 12px}.footnote{font-size:11px;color:var(--muted);line-height:1.6;margin-top:14px}@media(max-width:1050px){.shell{grid-template-columns:190px 1fr}.main{padding:25px 24px}.cards{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr 120px}.heroart{font-size:75px}}@media(max-width:730px){.shell{display:block}.sidebar{padding:12px;gap:12px;position:sticky;top:0;z-index:5;border-right:0;border-bottom:1px solid var(--line)}.logo{padding:4px}.brand{font-size:14px}.brand small{font-size:9px}.symbol{width:32px;height:32px;border-radius:10px;font-size:19px}.nav{flex-direction:row;overflow:auto;padding:0 2px}.nav button{white-space:nowrap;padding:9px 10px;font-size:12px;gap:6px}.nav button span.ico{width:auto;font-size:15px}.sidefoot{display:none}.main{padding:22px 15px 50px}.topbar{margin-bottom:23px}.topright .pill{display:none}.hero{grid-template-columns:1fr;padding:23px}.heroart{display:none}.cards,.two,.three{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.activity-row{align-items:flex-start;flex-direction:column}.activity-actions{width:100%}.activity-actions .btn{flex:1}.eventpic{height:125px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="logo"><div class="symbol">✳</div><div class="brand">Bem no Turno<small>MVP DEMONSTRATIVO</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot"><strong>Ambiente de demonstração</strong><br>Os dados históricos do RH são fictícios. Suas interações são salvas apenas neste navegador.<button onclick="resetDemo()">↻ Reiniciar demonstração</button></div></aside><main class="main"><header class="topbar"><div class="eyebrow" id="sectionLabel">SAÚDE E BEM-ESTAR</div><div class="topright"><span class="pill">● Turno da tarde • 14h–22h</span><span class="avatar">AN</span></div></header><div id="view"></div></main></div><div id="modalroot"></div><div id="toastroot"></div><script>
const EVENTS=[{id:'ginastica',name:'Pausa Ativa: alongamento',cat:'Movimento',icon:'🧘',when:'Terça, 10 de novembro',time:'15h30',duration:'10 minutos',place:'Área de convivência',shift:'Turno da tarde',desc:'Uma pausa curta com alongamentos orientados para reduzir desconfortos da rotina.',seats:20},{id:'vacina',name:'Dia de vacinação',cat:'Prevenção',icon:'💉',when:'Quinta, 12 de novembro',time:'16h',duration:'20 minutos',place:'Sala multiuso',shift:'Todos os turnos',desc:'Ação de atualização vacinal, mediante disponibilidade e critérios da equipe de saúde.',seats:30},{id:'alimentacao',name:'Alimentação no trabalho',cat:'Alimentação',icon:'🥗',when:'Sexta, 13 de novembro',time:'15h',duration:'25 minutos',place:'Sala de treinamento',shift:'Turno da tarde',desc:'Orientações práticas sobre alimentação e hidratação durante a jornada.',seats:25}];
const KEY='bem-no-turno-mvp-v3';const seed={enrolled:[],present:[],absent:{},ratings:{},votes:null};let state=load(),section='inicio',modal=null;function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&Array.isArray(s.enrolled)?{...seed,...s}:structuredClone(seed)}catch{return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function eventBy(id){return EVENTS.find(e=>e.id===id)}function toast(t){const root=document.getElementById('toastroot');root.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>{root.innerHTML=''},3300)}function navTo(t){section=t;modal=null;render();window.scrollTo(0,0)}function renderNav(){let items=[['inicio','⌂','Início'],['minhas','▣','Minhas ações'],['liga','★','Liga do Bem'],['rh','▥','Painel do RH']];document.getElementById('nav').innerHTML=items.map(([k,i,t])=>`<button class="${section===k?'on':''}" onclick="navTo('${k}')"><span class="ico">${i}</span>${t}</button>`).join('')}
function render(){renderNav();document.getElementById('sectionLabel').textContent=({inicio:'PORTAL DO COLABORADOR',minhas:'ACOMPANHAMENTO',liga:'PARTICIPAÇÃO COLETIVA',rh:'GESTÃO DE ENGAJAMENTO'})[section];document.getElementById('view').innerHTML=({inicio:home,minhas:myActivities,liga:league,rh:hr})[section]();renderModal()}
function home(){return `<h1 class="h1">Olá, Ana! 👋</h1><p class="sub">Encontre atividades de saúde e bem-estar que cabem na sua rotina.</p><div class="sectionhead"></div><div class="hero"><div><div class="eyebrow" style="color:#c7e9d2">SEU BEM-ESTAR IMPORTA</div><h2>Um pequeno cuidado<br>faz parte do seu dia.</h2><p>Veja as próximas ações, participe e ajude a melhorar a programação para todos.</p><button class="btn light" onclick="document.getElementById('eventos').scrollIntoView({behavior:'smooth'})">Ver atividades disponíveis →</button></div><div class="heroart">🌿</div></div><div id="eventos" class="sectionhead"><h2>Próximas ações para você</h2><small>Exemplos para demonstração</small></div><div class="cards">${EVENTS.map(eventCard).join('')}</div><div class="sectionhead"><h2>Por que participar?</h2></div><div class="three"><div class="panel"><h3>📣 Tudo em um lugar</h3><p class="sub">Você sabe o que vai acontecer, quando e onde.</p></div><div class="panel"><h3>🕒 Respeito ao turno</h3><p class="sub">Atividades com horário e duração visíveis para organizar sua participação.</p></div><div class="panel"><h3>💬 Sua opinião importa</h3><p class="sub">Mesmo se não participar, você pode contar o motivo e ajudar o RH.</p></div></div>`}
function eventCard(e){let status=state.present.includes(e.id)?'Presença registrada':state.absent[e.id]?'Ausência informada':state.enrolled.includes(e.id)?'Inscrito':'Ver atividade';return `<article class="event"><div class="eventpic"><span class="tag">${e.cat}</span>${e.icon}</div><div class="eventbody"><h3>${e.name}</h3><p>${e.desc}</p><div class="meta"><span>📆 <b>${e.when}</b> · ${e.time}</span><span>⏱ ${e.duration} &nbsp; 📍 ${e.place}</span></div><button class="btn ${state.enrolled.includes(e.id)?'secondary':''}" onclick="openEvent('${e.id}')">${status} →</button></div></article>`}
function myActivities(){let enrolled=EVENTS.filter(e=>state.enrolled.includes(e.id));return `<h1 class="h1">Minhas atividades</h1><p class="sub">Acompanhe suas inscrições, confirme presença ou informe por que não conseguiu participar.</p><div class="info">🧪 <b>Modo de demonstração:</b> você pode simular o check-in ou uma ausência imediatamente, sem esperar a data da atividade. Em uso real, o check-in seria habilitado no evento.</div><div class="sectionhead"><h2>Inscrições (${enrolled.length})</h2></div>${enrolled.length?enrolled.map(e=>`<div class="activity-row"><div><h3>${e.icon} ${e.name}</h3><p>${e.when} · ${e.time} · ${e.place}</p><div style="margin-top:8px">${state.present.includes(e.id)?'<span class="badge">✓ Participou</span>':state.absent[e.id]?'<span class="badge yellow">Ausência registrada</span>':'<span class="badge blue">Inscrito</span>'}</div></div><div class="activity-actions">${!state.present.includes(e.id)?`<button class="btn outline" onclick="openModal('checkin','${e.id}')">✓ Check-in</button>`:''}<button class="btn secondary" onclick="openModal('feedback','${e.id}')">☏ Feedback</button>${!state.present.includes(e.id)?`<button class="btn danger" onclick="openModal('ausencia','${e.id}')">Não participei</button>`:''}</div></div>`).join(''):'<div class="empty"><div>📅</div><h3>Você ainda não se inscreveu</h3><p>Explore as próximas ações e escolha uma atividade.</p><button class="btn" onclick="navTo(\'inicio\')">Ver atividades</button></div>'}`}
function league(){let myPoints=state.present.length*10+Object.keys(state.ratings).length*5;let value=(226+myPoints);return `<h1 class="h1">Liga do Bem-Estar ⭐</h1><p class="sub">Uma forma leve e coletiva de incentivar a participação, sem expor quem não consegue participar.</p><div class="hero" style="margin-top:24px"><div><div class="eyebrow" style="color:#d5e9d7">DESAFIO COLETIVO · SIMULADO</div><h2>Juntos por uma<br>rotina mais saudável</h2><p>Quando a equipe alcançar 300 pontos, desbloqueia um café coletivo de confraternização.</p><span style="font-weight:700">${value} / 300 pontos</span><div class="bar" style="margin-top:10px;background:#ffffff41"><div style="width:${Math.min(value/300*100,100)}%;background:#a9e6ba"></div></div></div><div class="heroart">🏆</div></div><div class="two" style="margin-top:20px"><div class="panel"><h3>Como pontuar</h3><p class="sub">Participação confirmada: <b>10 pontos</b><br>Feedback após atividade: <b>5 pontos</b></p><div class="line"></div><div class="bigquote">Você contribuiu com ${myPoints} pontos</div><p class="note">Os pontos iniciais do grupo são fictícios. Nunca devem ser usados para pressionar ou comparar individualmente funcionários.</p></div><div class="panel"><h3>Escolha a próxima atividade</h3><p class="sub">Qual tema você gostaria de ver na próxima programação?</p><div class="field"><select id="vote"><option value="">Selecione um tema...</option><option value="Sono e descanso" ${state.votes==='Sono e descanso'?'selected':''}>Sono e descanso</option><option value="Ergonomia" ${state.votes==='Ergonomia'?'selected':''}>Ergonomia</option><option value="Saúde mental" ${state.votes==='Saúde mental'?'selected':''}>Saúde mental</option><option value="Nutrição" ${state.votes==='Nutrição'?'selected':''}>Nutrição</option></select></div><button class="btn" onclick="vote()">Registrar minha preferência</button>${state.votes?`<p class="info">Sua preferência: ${esc(state.votes)}</p>`:''}</div></div>`}
function hr(){let n=state.enrolled.length,p=state.present.length,a=Object.keys(state.absent).length,f=Object.keys(state.ratings).length,baseline={invites:420,enroll:312,present:241,feedback:96};let totalEnroll=baseline.enroll+n,totalPresent=baseline.present+p,rate=Math.round(totalPresent/(baseline.invites)*100);let reasons=[['Horário incompatível',34],['Não consegui sair do setor',22],['Não soube da ação',18],['Esqueci',16],['Outros',10]];let actual=Object.values(state.absent).map(x=>x.reason);return `<h1 class="h1">Painel de engajamento</h1><p class="sub">Visão demonstrativa do RH para identificar oportunidades de melhoria nas ações.</p><div class="info warn">⚠️ <b>Dados fictícios:</b> os indicadores de base foram inventados somente para ilustrar o painel. As inscrições, presenças e respostas que você registrar neste navegador são adicionadas à simulação. Não são resultados da pesquisa de campo.</div><div class="stats"><div class="stat"><span class="ico">📨</span><b>${baseline.invites}</b><span>Convites simulados</span></div><div class="stat"><span class="ico">📝</span><b>${totalEnroll}</b><span>Inscrições</span></div><div class="stat"><span class="ico">✅</span><b>${totalPresent}</b><span>Presenças registradas</span></div><div class="stat"><span class="ico">📊</span><b>${rate}%</b><span>Presenças ÷ convites</span></div></div><div class="two"><div class="panel"><h3>Presença por turno</h3><p class="note">Valores ilustrativos para orientar decisões do RH.</p>${[['Manhã',72],['Tarde',58],['Noite',38]].map(([t,v])=>`<div class="chartrow"><div class="chartlabels"><b>${t}</b><span>${v}%</span></div><div class="bar"><div style="width:${v}%"></div></div></div>`).join('')}<div class="info">💡 <b>Hipótese a verificar:</b> oferecer mais horários ou organizar revezamento no turno com menor adesão.</div></div><div class="panel"><h3>Motivos de ausência</h3><p class="note">Distribuição de exemplo; respostas novas são listadas separadamente.</p>${reasons.map(([t,v])=>`<div class="chartrow"><div class="chartlabels"><b>${t}</b><span>${v}%</span></div><div class="bar orange"><div style="width:${v}%"></div></div></div>`).join('')}</div></div><div class="sectionhead"><h2>Registros feitos nesta demonstração</h2><small>Dados locais, sem envio para servidor</small></div><div class="panel"><table class="tbl"><thead><tr><th>Indicador</th><th>Registrado agora</th></tr></thead><tbody><tr><td>Novas inscrições</td><td>${n}</td></tr><tr><td>Check-ins realizados</td><td>${p}</td></tr><tr><td>Motivos de ausência</td><td>${a}</td></tr><tr><td>Avaliações recebidas</td><td>${f}</td></tr></tbody></table>${actual.length?`<div class="line"></div><h3>Motivos informados durante o teste</h3>${actual.map(x=>`<div class="chartrow">• ${esc(x)}</div>`).join('')}`:''}${state.votes?`<div class="info">Tema sugerido na votação: <b>${esc(state.votes)}</b></div>`:''}</div><div class="sectionhead"><h2>Como o RH pode agir?</h2></div><div class="three"><div class="panel"><h3>🕒 Ajustar horários</h3><p class="sub">Analisar turnos menos atendidos e testar novos horários ou revezamentos.</p></div><div class="panel"><h3>📣 Melhorar comunicação</h3><p class="sub">Divulgar atividades em canais realmente acessados pelos colaboradores.</p></div><div class="panel"><h3>🧩 Entender a ausência</h3><p class="sub">Investigar motivos relatados antes de atribuir a baixa adesão à falta de interesse.</p></div></div>`}
function openEvent(id){modal={type:'event',id};renderModal()}function openModal(type,id){modal={type,id};renderModal()}function closeModal(){modal=null;renderModal()}function renderModal(){let root=document.getElementById('modalroot');if(!modal){root.innerHTML='';return}let e=eventBy(modal.id);let content='';if(modal.type==='event')content=`<div class="modalhead"><div><div class="eyebrow">${e.cat}</div><h2>${e.icon} ${e.name}</h2></div><button class="x" onclick="closeModal()">✕</button></div><p class="sub">${e.desc}</p><div class="line"></div><div class="meta" style="font-size:14px"><span>📆 <b>${e.when}</b> · ${e.time}</span><span>📍 ${e.place}</span><span>⏱ Duração: ${e.duration}</span><span>👥 Organização: atividade prevista para ${e.shift.toLowerCase()}</span></div><div class="info">O RH deve organizar a liberação e o revezamento conforme as necessidades do setor. A inscrição não garante automaticamente a liberação.</div>${state.enrolled.includes(e.id)?`<button class="btn" onclick="navTo('minhas')">Acompanhar minha inscrição →</button>`:`<button class="btn" onclick="enroll('${e.id}')">Confirmar interesse / inscrição</button>`}`;
if(modal.type==='checkin')content=`<div class="modalhead"><h2>Confirmar presença</h2><button class="x" onclick="closeModal()">✕</button></div><p class="sub">${e.name}</p><div class="checkicon">▦</div><div class="info">Simulação de leitura do QR Code. No teste, clique abaixo para registrar sua presença nesta atividade.</div><button class="btn" onclick="checkin('${e.id}')">✓ Simular leitura e confirmar presença</button>`;
if(modal.type==='ausencia')content=`<div class="modalhead"><h2>Por que não participou?</h2><button class="x" onclick="closeModal()">✕</button></div><p class="sub">Sua resposta ajudará a planejar melhor as próximas ações.</p><div class="field"><label for="reason">Principal motivo</label><select id="reason"><option value="">Selecione...</option><option>Não fiquei sabendo a tempo</option><option>Horário incompatível</option><option>Não consegui sair do meu setor</option><option>Esqueci da atividade</option><option>O tema não me interessou</option><option>Outro motivo</option></select></div><div class="field"><label for="timing">Qual período seria melhor? (opcional)</label><select id="timing"><option value="">Prefiro não informar</option><option>Manhã</option><option>Tarde</option><option>Noite</option></select></div><p class="note">O motivo é mostrado no painel em formato agregado. O MVP não solicita dados sensíveis de saúde.</p><button class="btn" onclick="absence('${e.id}')">Enviar resposta</button>`;
if(modal.type==='feedback')content=`<div class="modalhead"><h2>Avaliar atividade</h2><button class="x" onclick="closeModal()">✕</button></div><p class="sub">${e.name}</p><div class="field"><label for="rating">Como você avalia a atividade?</label><select id="rating"><option value="">Selecione...</option><option value="5">5 — Excelente</option><option value="4">4 — Boa</option><option value="3">3 — Regular</option><option value="2">2 — Ruim</option><option value="1">1 — Muito ruim</option></select></div><div class="field"><label for="comment">Comentário (opcional)</label><textarea id="comment" placeholder="O que podemos melhorar?"></textarea></div><button class="btn" onclick="feedback('${e.id}')">Enviar avaliação</button>`;
root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function enroll(id){if(!state.enrolled.includes(id))state.enrolled.push(id);save();closeModal();toast('Inscrição confirmada! Veja em Minhas ações.');render()}
function checkin(id){if(!state.enrolled.includes(id)){toast('Inscreva-se antes de confirmar presença.');return}if(!state.present.includes(id))state.present.push(id);delete state.absent[id];save();closeModal();render();toast('Presença registrada! +10 pontos para o desafio coletivo.')}
function absence(id){let val=document.getElementById('reason').value,t=document.getElementById('timing').value;if(!val){toast('Selecione o motivo da ausência.');return}state.absent[id]={reason:val,timing:t};state.present=state.present.filter(x=>x!==id);save();closeModal();render();toast('Resposta registrada. Obrigado por ajudar a melhorar as ações!')}
function feedback(id){let val=document.getElementById('rating').value;let comment=document.getElementById('comment').value;if(!val){toast('Selecione uma avaliação.');return}state.ratings[id]={score:Number(val),comment};save();closeModal();render();toast('Avaliação registrada! Obrigado pelo seu feedback.')}
function vote(){let val=document.getElementById('vote').value;if(!val){toast('Escolha um tema antes de votar.');return}state.votes=val;save();render();toast('Sua preferência foi registrada!')}
function resetDemo(){if(!confirm('Reiniciar as inscrições, presenças, ausências e votos desta demonstração?'))return;state=structuredClone(seed);save();navTo('inicio');toast('Demonstração reiniciada.')}render();
</script></body></html>
